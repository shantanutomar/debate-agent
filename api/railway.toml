# Railway deployment configuration
# Docs: https://docs.railway.app/reference/config-as-code
#
# In the Railway dashboard:
#   Settings → Source → Root Directory → set to "api"
#
# Environment variables to set in Railway dashboard:
#   ALLOWED_ORIGINS   — comma-separated list of allowed frontend URLs
#                       e.g. https://debate-agent.vercel.app
#   OPENAI_API_KEY    — fallback key (optional; users can supply their own via the UI)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
